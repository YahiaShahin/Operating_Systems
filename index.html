<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Process Calculator Lab</title>
  <meta name="description" content="Hands-on operating systems project: build a calculator out of Linux processes using fork, exec, waitpid and gcc.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
  <script>try{var t=localStorage.getItem("process-calculator-lab:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#view">Skip to lesson</a>

  <header class="topbar">
    <button class="menu-btn" type="button" data-menu aria-expanded="false" aria-controls="sidebar">&#9776; Menu</button>
    <span class="brand" data-brand>Process Calculator Lab</span>
    <button class="menu-btn" type="button" data-theme-toggle aria-label="Change colour theme"></button>
    <span class="mini-meter" data-mini-meter></span>
  </header>

  <div class="shell">
    <nav class="sidebar" id="sidebar" aria-label="Course contents">
      <a class="sidebar-brand" href="#/" data-home data-brand>Process Calculator Lab</a>
      <p class="sidebar-eyebrow" data-eyebrow></p>
      <p class="notice" data-notice hidden role="status"></p>
      <div class="meter" role="progressbar" aria-label="Course progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
      <p class="meter-text" data-meter-text></p>
      <ol class="toc" data-toc></ol>
      <div class="sidebar-actions">
        <a class="btn small" href="#/">Dashboard</a>
        <button class="btn small" type="button" data-theme-toggle aria-label="Change colour theme"></button>
        <button class="btn small danger" type="button" data-reset>Reset progress</button>
      </div>
    </nav>

    <main class="main">
      <article class="view" id="view" tabindex="-1"></article>
    </main>
  </div>

  <div class="scrim" data-scrim></div>

  <dialog id="reset-dialog" aria-labelledby="reset-title">
    <form method="dialog">
      <h2 id="reset-title">Reset all progress?</h2>
      <p>This clears the completed lessons, ticked checkpoints and quiz answers saved in this browser. It cannot be undone.</p>
      <div class="row">
        <button class="btn" value="cancel">Cancel</button>
        <button class="btn primary" value="confirm">Reset progress</button>
      </div>
    </form>
  </dialog>

  <noscript><p style="padding:24px">This course needs JavaScript to show its lessons.</p></noscript>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
